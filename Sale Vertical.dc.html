<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Barlow+Condensed:wght@500;600;700&amp;family=Archivo:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: #2b2b2b; font-family: 'Archivo', sans-serif; }
  [contenteditable]:focus { outline: 2px dashed #C8102E; outline-offset: 3px; border-radius: 2px; }
  [contenteditable]:hover:not(:focus) { outline: 1px dashed rgba(200,16,46,.45); outline-offset: 3px; border-radius: 2px; }
  @page { size: 8.5in 11in; margin: 0; }
  @media print {
    body { background: #fff; }
    .no-print { display: none !important; }
    .wrap { padding: 0 !important; min-height: 0 !important; display: block !important; gap: 0 !important; }
    .flap { margin: 0 auto !important; }
    .sign { box-shadow: none !important; margin: 0 auto !important; }
    [contenteditable]:hover, [contenteditable]:focus { outline: none !important; }
  }
</style>
</helmet>

<div class="wrap" style="min-height:100vh; display:flex; flex-direction:column; align-items:center; gap:22px; padding:26px 16px 60px;">

  <div class="no-print" style="display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:center; background:#1a1a1a; border:1px solid #3a3a3a; border-radius:12px; padding:12px 16px;">
    <span style="color:#f2ece0; font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:15px; letter-spacing:.14em; text-transform:uppercase; margin-right:6px;">Vertical Sale Sign — click any text to edit</span>
    <button onClick="{{ onPrint }}" style="cursor:pointer; font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:15px; letter-spacing:.08em; text-transform:uppercase; color:#fff; background:#C8102E; border:none; border-radius:8px; padding:9px 18px;">Print / Save PDF</button>
    <button onClick="{{ onExample }}" style="cursor:pointer; font-family:'Barlow Condensed',sans-serif; font-weight:600; font-size:15px; letter-spacing:.06em; text-transform:uppercase; color:#f2ece0; background:#333; border:1px solid #4a4a4a; border-radius:8px; padding:9px 16px;">Load example</button>
    <button onClick="{{ onBlank }}" style="cursor:pointer; font-family:'Barlow Condensed',sans-serif; font-weight:600; font-size:15px; letter-spacing:.06em; text-transform:uppercase; color:#f2ece0; background:#333; border:1px solid #4a4a4a; border-radius:8px; padding:9px 16px;">Blank template</button>
  </div>

  <div class="flap" style="width:7.7in; height:1.5in; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; padding-bottom:6px; gap:6px;">
    <span style="font-family:'Barlow Condensed',sans-serif; font-weight:600; font-size:13px; letter-spacing:.28em; text-transform:uppercase; color:#b9b1a4;">Fold here — tuck under display box</span>
    <div style="width:100%; border-top:2px dashed #cfc7b8;"></div>
  </div>

  <div class="sign" style="width:7.7in; height:8.7in; background:#FBF6EC; box-shadow:0 24px 60px rgba(0,0,0,.5); display:flex; flex-direction:column; overflow:hidden; position:relative;">

    <!-- Header: store name -->
    <div style="background:#141414; color:#FBF6EC; padding:0.2in 0.4in; display:flex; align-items:center; justify-content:center; gap:12px; border-bottom:6px solid #C8102E;">
      <span style="color:#C8102E; font-size:22px;">◆</span>
      <span data-field="store" contenteditable="true" style="font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:34px; letter-spacing:.16em; text-transform:uppercase; line-height:1; text-align:center;">The Tap House</span>
      <span style="color:#C8102E; font-size:22px;">◆</span>
    </div>

    <!-- Body -->
    <div style="flex:1; display:flex; flex-direction:column; padding:0.3in 0.45in 0; min-height:0;">

      <!-- Product + size -->
      <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:14px;">
        <div data-field="product" contenteditable="true" style="font-family:'Anton',sans-serif; font-size:46px; line-height:0.96; text-transform:uppercase; color:#141414; letter-spacing:.005em; text-wrap:balance; max-width:5in;">Gran Centenario Plata</div>
        <div style="flex:none; background:#141414; color:#FBF6EC; font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:24px; letter-spacing:.06em; text-transform:uppercase; padding:6px 14px; border-radius:6px; white-space:nowrap;"><span data-field="size" contenteditable="true" data-om-id="18978261:28">750ml</span></div>
      </div>

      <!-- Price zone -->
      <div style="flex:1; display:flex; align-items:center; gap:0.4in; margin-top:0.18in; min-height:0;">

        <!-- left: was + save -->
        <div style="flex:none; width:2.5in; display:flex; flex-direction:column; align-items:flex-start; gap:0.28in;">
          <div>
            <div style="font-family:'Barlow Condensed',sans-serif; font-weight:600; font-size:22px; letter-spacing:.18em; text-transform:uppercase; color:#6a6258;">Regular Price</div>
            <div style="font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:54px; line-height:0.95; color:#6a6258; white-space:nowrap; text-decoration:line-through; text-decoration-thickness:5px; text-decoration-color:#C8102E;">$<span data-field="was" contenteditable="true">34.99</span></div>
          </div>
          <div style="width:2.1in; height:2.1in; border-radius:50%; background:#C8102E; color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow:0 8px 0 #8f0a20; transform:rotate(-8deg);">
            <span style="font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:30px; letter-spacing:.14em; text-transform:uppercase; line-height:1;">Save</span>
            <span style="font-family:'Anton',sans-serif; font-size:72px; line-height:0.9;">$<span data-field="save" contenteditable="true">10</span></span>
          </div>
        </div>

        <!-- right: cash hero -->
        <div style="flex:1; align-self:stretch; background:#141414; border-radius:16px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:0.25in;">
          <div style="font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:30px; letter-spacing:.24em; text-transform:uppercase; color:#FBF6EC;">Cash Price</div>
          <div style="display:flex; align-items:flex-start; color:#fff; line-height:0.78;">
            <span style="font-family:'Anton',sans-serif; font-size:60px; margin-top:8px; color:#C8102E;">$</span>
            <span data-field="cash" contenteditable="true" style="font-family:'Anton',sans-serif; font-size:150px;">24.99</span>
          </div>
          <div style="font-family:'Barlow Condensed',sans-serif; font-weight:600; font-size:20px; letter-spacing:.16em; text-transform:uppercase; color:#8f877a;">Pay with cash &amp; save</div>
        </div>

      </div>
    </div>

    <!-- Bottom mark: card price note -->
    <div style="background:#C8102E; color:#fff; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:0.18in 0.4in; margin-top:0.22in;">
      <div style="display:flex; align-items:center; gap:14px;">
        <span style="font-size:26px;">✦</span>
        <div>
          <div style="font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:24px; letter-spacing:.1em; text-transform:uppercase; line-height:1.05;">Card Price&nbsp; $<span data-field="card" contenteditable="true">25.49</span></div>
          <div style="font-family:'Archivo',sans-serif; font-weight:500; font-size:14px; letter-spacing:.02em; opacity:.92;">Card price differs from the cash price shown above.</div>
        </div>
      </div>
      <div style="text-align:right; font-family:'Barlow Condensed',sans-serif; font-weight:600; font-size:16px; letter-spacing:.12em; text-transform:uppercase; white-space:nowrap;">SKU&nbsp; <span data-field="sku" contenteditable="true">000000</span></div>
    </div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  example() {
    return { store: "The Tap House", product: "Gran Centenario Plata",
      size: "750 ml", was: "34.99", save: "10", cash: "24.99", card: "25.49", sku: "000000" };
  }

  componentDidMount() {
    const saved = this.load();
    this.fieldsList().forEach(f => {
      const k = f.getAttribute('data-field');
      if (saved && saved[k] != null) f.textContent = saved[k];
      f.addEventListener('input', () => this.save());
      f.addEventListener('blur', () => this.save());
    });
  }

  fieldsList() { return Array.from(document.querySelectorAll('[data-field]')); }
  read() { const o = {}; this.fieldsList().forEach(f => o[f.getAttribute('data-field')] = f.textContent.trim()); return o; }
  save() { try { localStorage.setItem('saleSignV', JSON.stringify(this.read())); } catch(e){} }
  load() { try { return JSON.parse(localStorage.getItem('saleSignV') || 'null'); } catch(e){ return null; } }
  apply(vals) { this.fieldsList().forEach(f => { const k = f.getAttribute('data-field'); if (vals[k] != null) f.textContent = vals[k]; }); this.save(); }

  renderVals() {
    return {
      onPrint: () => window.print(),
      onExample: () => this.apply(this.example()),
      onBlank: () => this.apply({ store:'Store Name', product:'Product Name', size:'750 ml', was:'0.00', save:'0', cash:'0.00', card:'0.00', sku:'000000' }),
    };
  }
}
</script>
</body>
</html>
